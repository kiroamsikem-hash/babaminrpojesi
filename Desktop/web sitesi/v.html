<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyor...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
        }
    </style>
</head>
<body>
    <script>
        // URL'den ID al: /v/abc123 -> abc123
        const path = window.location.pathname;
        const parts = path.split('/');
        const id = parts[parts.length - 1]; // Son parçayı al
        
        if (id && id !== 'v.html' && id !== 'v') {
            // view.html'e yönlendir
            window.location.href = `/view.html?id=${id}`;
        } else {
            // Geçersiz link
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
