<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Minecraft Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://unpkg.com/@xterm/addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://unpkg.com/@xterm/addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#09090b',
                        'dark-secondary': '#121214',
                        'electric-purple': '#8b5cf6',
                        'success-green': '#10b981',
                        'danger-red': '#ef4444'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-primary text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar bg-dark-secondary w-64 h-full flex flex-col transition-all duration-300">
            <!-- Logo -->
            <div class="p-6 border-b border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-electric-purple rounded-lg flex items-center justify-center glow-electric">
                        <i class="fas fa-cube text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold text-white">Minecraft Panel</h1>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="/dashboard" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg bg-electric-purple text-white transition-colors">
                    <i class="fas fa-tachometer-alt w-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/servers" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors">
                    <i class="fas fa-server w-5"></i>
                    <span>Servers</span>
                </a>
                <div class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors cursor-pointer" id="filesToggle">
                    <i class="fas fa-folder w-5"></i>
                    <span>File Manager</span>
                </div>
                <div class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors cursor-pointer" id="backupsToggle">
                    <i class="fas fa-archive w-5"></i>
                    <span>Backups</span>
                </div>
                <div class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors cursor-pointer" id="consoleToggle">
                    <i class="fas fa-terminal w-5"></i>
                    <span>Console</span>
                </div>
                <div class="mt-auto">
                    <div id="adminLink" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors cursor-pointer" style="display: none;">
                        <i class="fas fa-cog w-5"></i>
                        <span>Admin</span>
                    </div>
                    <button id="logoutBtn" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors w-full text-left">
                        <i class="fas fa-sign-out-alt w-5"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-dark-secondary border-b border-gray-700 px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <button id="sidebarToggle" class="text-gray-400 hover:text-white transition-colors">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h2 class="text-xl font-semibold">Welcome, <span id="userName" class="text-electric-purple">User</span></h2>
                    </div>
                    <button id="createServerBtn" class="bg-electric-purple hover:bg-purple-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors glow-electric">
                        <i class="fas fa-plus"></i>
                        <span>Create Server</span>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <main class="flex-1 overflow-auto p-6">
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-dark-secondary rounded-lg p-6 border border-gray-700">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400 text-sm">Total Servers</p>
                                <p class="text-2xl font-bold text-white" id="serverCount">0</p>
                            </div>
                            <div class="w-12 h-12 bg-electric-purple rounded-lg flex items-center justify-center">
                                <i class="fas fa-server text-white"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark-secondary rounded-lg p-6 border border-gray-700">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400 text-sm">Running Servers</p>
                                <p class="text-2xl font-bold text-success-green" id="runningServers">0</p>
                            </div>
                            <div class="w-12 h-12 bg-success-green rounded-lg flex items-center justify-center">
                                <i class="fas fa-play-circle text-white"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark-secondary rounded-lg p-6 border border-gray-700">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400 text-sm">Stopped Servers</p>
                                <p class="text-2xl font-bold text-danger-red" id="stoppedServers">0</p>
                            </div>
                            <div class="w-12 h-12 bg-danger-red rounded-lg flex items-center justify-center">
                                <i class="fas fa-stop-circle text-white"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-dark-secondary rounded-lg p-6 border border-gray-700">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-400 text-sm">Total Players</p>
                                <p class="text-2xl font-bold text-white" id="totalPlayers">0</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-500 rounded-lg flex items-center justify-center">
                                <i class="fas fa-users text-white"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Servers Grid -->
                <div class="mb-8">
                    <h3 class="text-xl font-semibold text-white mb-4">Your Servers</h3>
                    <div id="serversList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Servers will be loaded here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create Server Modal -->
    <div id="createServerModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-dark-secondary rounded-lg p-6 w-full max-w-2xl mx-4 border border-gray-700">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold text-white">Create New Server</h3>
                <button class="text-gray-400 hover:text-white close-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="createServerForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Server Name</label>
                        <input type="text" id="serverName" class="w-full bg-dark-primary border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-electric-purple" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Minecraft Version</label>
                        <select id="serverVersion" class="w-full bg-dark-primary border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-electric-purple" required>
                            <option value="1.20.1" class="bg-dark-primary">1.20.1</option>
                            <option value="1.19.4" class="bg-dark-primary">1.19.4</option>
                            <option value="1.18.2" class="bg-dark-primary">1.18.2</option>
                            <option value="1.17.1" class="bg-dark-primary">1.17.1</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Memory (MB)</label>
                        <input type="number" id="serverMemory" value="2048" min="512" max="16384" class="w-full bg-dark-primary border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-electric-purple" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Disk Space (MB)</label>
                        <input type="number" id="serverDisk" value="10240" min="1024" class="w-full bg-dark-primary border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-electric-purple" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Description (Optional)</label>
                    <textarea id="serverDescription" rows="3" class="w-full bg-dark-primary border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-electric-purple resize-none"></textarea>
                </div>

                <div class="flex justify-end space-x-3">
                    <button type="button" class="px-4 py-2 text-gray-300 hover:text-white transition-colors close-modal">Cancel</button>
                    <button type="submit" class="bg-electric-purple hover:bg-purple-700 text-white px-6 py-2 rounded-lg transition-colors glow-electric">
                        Create Server
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Server Details Modal -->
    <div id="serverDetailsModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-dark-secondary rounded-lg p-6 w-full max-w-4xl mx-4 border border-gray-700 max-h-[90vh] overflow-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold text-white">Server Details</h3>
                <button class="text-gray-400 hover:text-white close-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="serverDetails" class="space-y-6">
                <!-- Server details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notifications" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.0/socket.io.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
