[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stdout_logfile=/app/logs/sshd.log
stderr_logfile=/app/logs/sshd.error.log

[program:daemon]
command=npm run daemon
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/daemon.log
stderr_logfile=/app/logs/daemon.error.log
environment=NODE_ENV=production

[program:cleanup]
command=bash -c "while true; do sleep 3600; rm -rf /tmp/*; done"
autostart=true
autorestart=true
stdout_logfile=/app/logs/cleanup.log