name: kiwo
description: AI-powered education assistant - Kiwo
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.5
  
  # OCR
  google_mlkit_text_recognition: ^0.13.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Math Rendering (LaTeX)
  flutter_math_fork: ^0.7.1
  
  # Authentication
  google_sign_in: ^6.1.6
  
  # Utils
  intl: ^0.18.1
  timeago: ^3.6.0
  
  # Graphing
  fl_chart: ^0.66.0
  math_expressions: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
